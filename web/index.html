  <script>
    (function() {
      var raw = '';
      try { raw = document.cookie || ''; } catch (_) {}
      function readCookie(name) {
        var prefix = name + '=';
        var parts = raw.split(';');
        for (var i = 0; i < parts.length; i++) {
          var part = parts[i].trim();
          if (part.indexOf(prefix) === 0) {
            try { return decodeURIComponent(part.slice(prefix.length)); } catch (_) { return part.slice(prefix.length); }
          }
        }
        return '';
      }
      var themeMode = readCookie('ax_theme_mode');
      var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      var isLight = themeMode === 'light' || (themeMode === 'system' && prefersLight);
      var root = document.documentElement;
      if (isLight) root.classList.add('aj-light');
      var silentRaw = readCookie('ax_silent_nav');
      var hasSilentFlag = silentRaw === '1' || silentRaw.indexOf('1|') === 0;
      var silentLabel = silentRaw.indexOf('1|') === 0 ? silentRaw.slice(2).trim() : '';
      if (!/^[a-zA-Z0-9 ]{1,24}$/.test(silentLabel)) silentLabel = '';
      var refHost = '';
      try { if (document.referrer) refHost = new URL(document.referrer).hostname.toLowerCase(); } catch (_) {}
      var sameRootRef = refHost === 'alphajournal.in' || refHost.endsWith('.alphajournal.in');
      var curHost = String(location.hostname || '').toLowerCase();
      var sameRootCur = curHost === 'alphajournal.in' || curHost.endsWith('.alphajournal.in');
      var hasSessionOrConsent = Boolean(readCookie('ax_sb_auth.n') || readCookie('ax_onboard'));
      if (hasSilentFlag || (sameRootRef && sameRootCur && hasSessionOrConsent && refHost && refHost !== curHost)) {
        root.classList.add('aj-silent-nav');
        window.__ajSilentNav = true;
        window.__ajSilentLabel = silentLabel;
      }
      if (hasSilentFlag) {
        try {
          var secure = location.protocol === 'https:' ? '; Secure' : '';
          var domain = sameRootCur ? '; Domain=.alphajournal.in' : '';
          document.cookie = 'ax_silent_nav=; Path=/; Max-Age=0; SameSite=Lax' + domain + secure;
        } catch (_) {}
      }
      window.addEventListener('pageshow', function() {
        var veil = document.getElementById('aj-nav-veil');
        if (veil && veil.parentNode) veil.parentNode.removeChild(veil);
      });
    })();

  <style>
    :root {
      --bg: #0D0C0B;
      --fg: #FAF9F6;
      --muted: #8B9FE8;
      --pill-bg: rgba(24, 22, 20, 0.85);
      --pill-border: rgba(250, 249, 246, 0.12);
      --h: min(24vh, clamp(28px, 7vw, 92px));
      box-sizing: border-box;
      color-scheme: dark;
    }
    html.aj-light {
      --bg: #FAF9F6;
      --fg: #0D0C0B;
      --pill-bg: rgba(255, 255, 255, 0.88);
      --pill-border: rgba(13, 12, 11, 0.10);
      color-scheme: light;
    }
    html.aj-light body {
      background-color: #FAF9F6 !important;
    }
    .aj-silent-shell { display: none; }
    html.aj-silent-nav #splash-loader {
      background: var(--bg);
      transition: opacity 0.2s cubic-bezier(0.22, 1, 0.36, 1), transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: center center;
    }
    html.aj-silent-nav .splash-threads,
    html.aj-silent-nav .word,
    html.aj-silent-nav .soon {
      display: none !important;
    }
    html.aj-silent-nav .aj-silent-shell {
      display: flex;
      align-items: center;
      justify-content: center;
      inset: 0;
      position: fixed;
      pointer-events: none;
    }
    html.aj-silent-nav .aj-silent-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, #8B9FE8 50%, transparent 100%);
      background-size: 40% 100%;
      background-repeat: no-repeat;
      animation: aj-bar 0.9s ease-in-out infinite;
    }
    html.aj-silent-nav .aj-silent-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      color: var(--fg);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.01em;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }
    html.aj-silent-nav .aj-silent-spinner {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--pill-border);
      border-top-color: #8B9FE8;
      animation: aj-spin 0.7s linear infinite;
    }
    @keyframes aj-bar {
      0% { background-position: -40% 0; }
      100% { background-position: 140% 0; }
    }
    @keyframes aj-spin {
      to { transform: rotate(360deg); }
    }
    #splash-loader {
      position: fixed;
      inset: 0;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: calc(var(--h) * 0.35);
      z-index: 999999;
      font-family: Anton, Impact, "Arial Narrow", sans-serif;
      transition: opacity 0.45s ease-out;
      overflow: hidden;
    }
    .splash-threads {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .5;
      /* AlphaThreadBackdrop.auth uses a 1600 × 540 canvas and one scale for all edges. */
      --band: 200px;
      --thread-depth: max(33.75vw, var(--band));
      --thread-width: calc(var(--thread-depth) * 1600 / 540);
    }
    @media (min-width: 700px) { .splash-threads { --band: 320px; } }
    .splash-threads i {
      position: absolute;
      width: 100%;
      height: var(--thread-depth);
    }
    .splash-threads i::before {
      content: "";
      display: block;
      height: 100%;
      background: url("auth-threads.webp") center var(--row) / var(--thread-width) 400% no-repeat;
    }
    .thread-top { --row: 0%; top: 0; left: 0; }
    .thread-bottom { --row: 33.333333%; bottom: 0; left: 0; transform: rotate(180deg); }
    .splash-threads .thread-left, .splash-threads .thread-right {
      display: none;
      width: 100vh;
      width: 100dvh;
      transform-origin: top left;
    }
    .thread-left { --row: 66.666667%; top: 100%; left: 0; transform: rotate(-90deg); }
    .thread-right { --row: 100%; top: 0; left: 100%; transform: rotate(90deg); }
    @media (min-width: 700px) and (hover: hover),
           (min-width: 700px) and (min-height: 600px) {
      .splash-threads .thread-left, .splash-threads .thread-right { display: block; }
    }
    .word { font-size: calc(var(--h) * 1.1); line-height: var(--h); margin: 0; font-weight: normal; display: flex; justify-content: center; gap: calc(var(--h) * 0.03); }
    .letter {
      position: relative;
      display: block;
      height: var(--h);
      font-size: calc(var(--h) * 1.1);
      line-height: var(--h);
    }
    .sizer { visibility: hidden; display: block; }
    .band {
      position: absolute;
      inset: 0;
      clip-path: var(--rest-clip);
      animation: aj-band 1700ms cubic-bezier(.42, 0, .58, 1) var(--delay);
    }
    @keyframes aj-band {
      0%, 100% { clip-path: var(--rest-clip); }
      50% { clip-path: var(--peak-clip); }
    }
    @keyframes aj-glyph {
      0%, 100% { transform: none; }
      50% { transform: translateY(var(--shift)) scaleY(var(--scale)); }
    }
    .g {
      position: absolute; left: 0; top: 0; width: 100%;
      height: var(--h);
      transform-origin: 0 0;
      animation: aj-glyph 1700ms cubic-bezier(.42, 0, .58, 1) var(--delay);
    }
    .soon {
      margin: 0;
      font-size: clamp(12px, 1.8vw, 20px);
      letter-spacing: 0.5em;
      padding-left: 0.5em;
      text-transform: uppercase;
      color: var(--muted);
      animation: aj-pulse 2.5s ease-in-out infinite alternate;
    }
    @keyframes aj-pulse { from { opacity: 0.4; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .soon, .band, .g { animation: none; }
      .letter .sizer { visibility: visible; }
      .letter .band { display: none; }
      .splash-threads i::before { background-image: url("auth-threads.webp"); }
    }
  </style>
  <script>
    (function() {
      const TEXT = "ALPHAJOURNAL";
      const word = document.getElementById("word");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      if (!window.__ajSilentNav && word && !reducedMotion.matches) {
        const fragment = document.createDocumentFragment();
        const layouts = [[0, .24, .71, 1], [0, .40, .64, 1], [0, .28, .76, 1]];
        for (const [index, character] of [...TEXT].entries()) {
          const letter = document.createElement("span");
          letter.className = "letter";
          letter.style.setProperty("--delay", `${index * 32}ms`);
          letter.setAttribute("aria-hidden", "true");
          const sizer = document.createElement("span");
          sizer.className = "sizer";
          sizer.textContent = character;
          letter.append(sizer);
          fragment.append(letter);

          const stops = layouts[index % layouts.length];
          for (let slice = 0; slice < 3; slice++) {
            const band = document.createElement("span");
            band.className = "band";
            const glyph = document.createElement("span");
            glyph.className = "g";
            glyph.textContent = character;
            band.append(glyph);
            letter.append(band);

            const top = slice / 3;
            const clip = (from, to) =>
              `inset(${from * 100}% 0 calc(${(1 - to) * 100}% - .5px) 0)`;
            const scale = (stops[slice + 1] - stops[slice]) * 3;
            band.style.setProperty("--rest-clip", clip(top, (slice + 1) / 3));
            band.style.setProperty("--peak-clip", clip(stops[slice], stops[slice + 1]));
            band.style.setProperty("--shift", `${(stops[slice] - top * scale) * 100}%`);
            band.style.setProperty("--scale", scale);
          }
        }
        word.replaceChildren(fragment);
      }

      var silentText = document.getElementById('aj-silent-text');
      if (silentText && window.__ajSilentLabel) {
        silentText.textContent = 'Opening ' + window.__ajSilentLabel + '…';
      }

      function hideSplash() {
        var splash = document.getElementById('splash-loader');
        if (splash && splash.style.opacity !== '0') {
          if (window.__ajSilentNav) {
            splash.style.transform = 'scale(0.992)';
          }
          splash.style.opacity = '0';
          setTimeout(function() {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, window.__ajSilentNav ? 200 : 450);
        }
      }
      // Flutter calls this after authentication AND account access resolve.
      // A first frame or a timer alone can expose intermediate loading screens.
      window.alphajournalReady = hideSplash;
    })();
  </script>
