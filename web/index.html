  <!-- Fonts for kinetic splash -->

<body style="background-color: #0D0C0B; margin: 0; padding: 0; overflow: hidden;">
  <div id="splash-loader">
    <div class="splash-threads" aria-hidden="true">
      <i class="thread-top"></i><i class="thread-bottom"></i>
      <i class="thread-left"></i><i class="thread-right"></i>
    </div>
    <h1 class="word" id="word" aria-label="AlphaJournal">ALPHAJOURNAL</h1>
    <p class="soon">Intelligent market execution</p>
  </div>
  <style>
    :root {
      --bg: #0D0C0B;
      --fg: #FAF9F6;
      --muted: #8B9FE8;
      --h: min(24vh, clamp(28px, 7vw, 92px));
      box-sizing: border-box;
      color-scheme: dark;
    }
    #splash-loader {
      position: fixed;
      inset: 0;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: calc(var(--h) * 0.35);
      z-index: 999999;
      font-family: Anton, Impact, "Arial Narrow", sans-serif;
      transition: opacity 0.45s ease-out;
      overflow: hidden;
    }
    .splash-threads {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .5;
      /* AlphaThreadBackdrop.auth uses a 1600 × 540 canvas and one scale for all edges. */
      --band: 200px;
      --thread-depth: max(33.75vw, var(--band));
      --thread-width: calc(var(--thread-depth) * 1600 / 540);
    }
    @media (min-width: 700px) { .splash-threads { --band: 320px; } }
    .splash-threads i {
      position: absolute;
      width: 100%;
      height: var(--thread-depth);
    }
    .splash-threads i::before {
      content: "";
      display: block;
      height: 100%;
      background: url("auth-threads.webp") center var(--row) / var(--thread-width) 400% no-repeat;
      background-image: image-set(url("auth-thread-pull.avif") type("image/avif"), url("auth-threads.webp") type("image/webp"));
    }
    .thread-top { --row: 0%; top: 0; left: 0; }
    .thread-bottom { --row: 33.333333%; bottom: 0; left: 0; transform: rotate(180deg); }
    .splash-threads .thread-left, .splash-threads .thread-right {
      display: none;
      width: 100vh;
      width: 100dvh;
      transform-origin: top left;
    }
    .thread-left { --row: 66.666667%; top: 100%; left: 0; transform: rotate(-90deg); }
    .thread-right { --row: 100%; top: 0; left: 100%; transform: rotate(90deg); }
    @media (min-width: 700px) and (hover: hover),
           (min-width: 700px) and (min-height: 600px) {
      .splash-threads .thread-left, .splash-threads .thread-right { display: block; }
    }
    .word { font-size: calc(var(--h) * 1.1); line-height: var(--h); margin: 0; font-weight: normal; display: flex; justify-content: center; gap: calc(var(--h) * 0.03); }
    .letter {
      position: relative;
      display: block;
      height: var(--h);
      font-size: calc(var(--h) * 1.1);
      line-height: var(--h);
    }
    .sizer { visibility: hidden; display: block; }
    .band {
      position: absolute;
      inset: 0;
      clip-path: var(--rest-clip);
      animation: aj-band 1700ms cubic-bezier(.42, 0, .58, 1) var(--delay);
    }
    @keyframes aj-band {
      0%, 100% { clip-path: var(--rest-clip); }
      50% { clip-path: var(--peak-clip); }
    }
    @keyframes aj-glyph {
      0%, 100% { transform: none; }
      50% { transform: translateY(var(--shift)) scaleY(var(--scale)); }
    }
    .g {
      position: absolute; left: 0; top: 0; width: 100%;
      height: var(--h);
      transform-origin: 0 0;
      animation: aj-glyph 1700ms cubic-bezier(.42, 0, .58, 1) var(--delay);
    }
    .soon {
      margin: 0;
      font-size: clamp(12px, 1.8vw, 20px);
      letter-spacing: 0.5em;
      padding-left: 0.5em;
      text-transform: uppercase;
      color: var(--muted);
      animation: aj-pulse 2.5s ease-in-out infinite alternate;
    }
    @keyframes aj-pulse { from { opacity: 0.4; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .soon, .band, .g { animation: none; }
      .letter .sizer { visibility: visible; }
      .letter .band { display: none; }
      .splash-threads i::before { background-image: url("auth-threads.webp"); }
    }
  </style>
  <script>
    (function() {
      const TEXT = "ALPHAJOURNAL";
      const word = document.getElementById("word");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      if (word && !reducedMotion.matches) {
        const fragment = document.createDocumentFragment();
        const layouts = [[0, .24, .71, 1], [0, .40, .64, 1], [0, .28, .76, 1]];
        for (const [index, character] of [...TEXT].entries()) {
          const letter = document.createElement("span");
          letter.className = "letter";
          letter.style.setProperty("--delay", `${index * 32}ms`);
          letter.setAttribute("aria-hidden", "true");
          const sizer = document.createElement("span");
          sizer.className = "sizer";
          sizer.textContent = character;
          letter.append(sizer);
          fragment.append(letter);

          const stops = layouts[index % layouts.length];
          for (let slice = 0; slice < 3; slice++) {
            const band = document.createElement("span");
            band.className = "band";
            const glyph = document.createElement("span");
            glyph.className = "g";
            glyph.textContent = character;
            band.append(glyph);
            letter.append(band);

            const top = slice / 3;
            const clip = (from, to) =>
              `inset(${from * 100}% 0 calc(${(1 - to) * 100}% - .5px) 0)`;
            const scale = (stops[slice + 1] - stops[slice]) * 3;
            band.style.setProperty("--rest-clip", clip(top, (slice + 1) / 3));
            band.style.setProperty("--peak-clip", clip(stops[slice], stops[slice + 1]));
            band.style.setProperty("--shift", `${(stops[slice] - top * scale) * 100}%`);
            band.style.setProperty("--scale", scale);
          }
        }
        word.replaceChildren(fragment);
      }

      function hideSplash() {
        var splash = document.getElementById('splash-loader');
        if (splash && splash.style.opacity !== '0') {
          splash.style.opacity = '0';
          setTimeout(function() {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 450);
        }
      }
      // Flutter calls this after authentication AND account access resolve.
      // A first frame or a timer alone can expose intermediate loading screens.
      window.alphajournalReady = hideSplash;
    })();
  </script>
  <script src="app_install.js"></script>
  <script src="keyboard_viewport.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
