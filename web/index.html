  <!-- Fonts for kinetic splash -->

<body style="background-color: #0D0C0B; margin: 0; padding: 0; overflow: hidden; height: 100vh; width: 100vw;">
  <div id="splash-loader">
    <h1 class="word" id="word" aria-label="AlphaJournal"></h1>
    <p class="soon">Intelligent market execution</p>
  </div>
  <style>
    :root {
      --bg: #0D0C0B;
      --fg: #FAF9F6;
      --muted: #8B9FE8;
      --h: min(24vh, clamp(28px, 7vw, 92px));
      box-sizing: border-box;
      color-scheme: dark;
    }
    #splash-loader {
      position: fixed;
      inset: 0;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: calc(var(--h) * 0.35);
      z-index: 999999;
      font-family: Anton, Impact, "Arial Narrow", sans-serif;
      transition: opacity 0.45s ease-out;
      overflow: hidden;
    }
    .word { margin: 0; font-weight: normal; display: flex; justify-content: center; gap: calc(var(--h) * 0.03); }
    .letter {
      position: relative;
      display: block;
      height: var(--h);
      font-size: calc(var(--h) * 1.1);
      line-height: var(--h);
    }
    .sizer { visibility: hidden; display: block; }
    .band { position: absolute; inset: 0; }
    .g {
      position: absolute; left: 0; top: 0; width: 100%;
      height: var(--h);
      transform-origin: 0 0;
      will-change: transform;
    }
    .soon {
      margin: 0;
      font-size: clamp(12px, 1.8vw, 20px);
      letter-spacing: 0.5em;
      padding-left: 0.5em;
      text-transform: uppercase;
      color: var(--muted);
      animation: aj-pulse 2.5s ease-in-out infinite alternate;
    }
    @keyframes aj-pulse { from { opacity: 0.4; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .soon { animation: none; } }
  </style>
  <script>
    (function() {
      const TEXT = "ALPHAJOURNAL";
      const word = document.getElementById("word");
      const SRC = [0, 1 / 3, 2 / 3, 1];
      const LAYOUTS = [
        [0, 0.14, 0.78, 1],
        [0, 0.5, 0.62, 1],
        [0, 0.24, 0.9, 1]
      ];
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      let animId = null;
      if (word) {
        const letters = [...TEXT].map((ch, i) => {
          const el = document.createElement("span");
          el.className = "letter";
          el.setAttribute("aria-hidden", "true");
          el.innerHTML = '<span class="sizer">' + ch + "</span>" +
            [0, 1, 2].map(() => '<span class="band"><span class="g">' + ch + "</span></span>").join("");
          word.appendChild(el);
          return {
            el,
            bands: [...el.querySelectorAll(".band")].map(b => ({ band: b, g: b.firstChild })),
            target: LAYOUTS[i % LAYOUTS.length],
            dur: 2.5 * (0.8 + ((i * 7) % 5) * 0.1),
            off: i * 0.35
          };
        });

        const ease = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

        function render(now) {
          if (!letters.length || !letters[0].el) return;
          const H = letters[0].el.offsetHeight || 48;
          for (const L of letters) {
            let e = 0;
            if (!reduce) {
              const u = ((now / 1000 + L.off) / L.dur) % 2;
              e = ease(u > 1 ? 2 - u : u);
            }
            for (let k = 0; k < 3; k++) {
              const a = SRC[k], b = SRC[k + 1];
              const c = (a + (L.target[k] - a) * e) * H;
              const d = (b + (L.target[k + 1] - b) * e) * H;
              const s = (d - c) / ((b - a) * H);
              const ty = c - a * H * s;
              const { band, g } = L.bands[k];
              band.style.clipPath = "inset(" + c.toFixed(2) + "px 0 " + Math.max(0, H - d - 0.5).toFixed(2) + "px 0)";
              g.style.transform = "translateY(" + ty.toFixed(2) + "px) scaleY(" + s.toFixed(4) + ")";
            }
          }
          if (!reduce) animId = requestAnimationFrame(render);
        }
        animId = requestAnimationFrame(render);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => reduce && render(0));
      }

      function hideSplash() {
        var splash = document.getElementById('splash-loader');
        if (splash && splash.style.opacity !== '0') {
          splash.style.opacity = '0';
          if (animId) cancelAnimationFrame(animId);
          setTimeout(function() {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 450);
        }
      }
      // Flutter calls this after authentication AND account access resolve.
      // A first frame or a timer alone can expose intermediate loading screens.
      window.alphajournalReady = hideSplash;
    })();
  </script>
