name: Supabase Market & News Database Sync

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      sync_scope:
        description: Dataset to synchronize
        default: all
        type: choice
        options: [all, quotes, history, news, screeners]
      fetch_live:
        description: Fetch and publish live data (false runs offline validation only)
        default: true
        type: boolean
  pull_request:
    paths: ['scripts/**', 'test/scripts/**', '.github/workflows/supabase-market-sync.yml']
  push:
    branches: [main, feature/admin, fix/copilot]
    paths: ['scripts/**', 'test/scripts/**', '.github/workflows/supabase-market-sync.yml', 'database/schema.sql']

permissions:
  contents: read

jobs:
  validate:
    name: Validate provider parsing and database failure handling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s test/scripts -p 'test_*.py' -v
      - run: python -m compileall -q scripts

  sync:
    name: Fetch, validate and publish real market data
    needs: validate
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.fetch_live) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: supabase-market-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: python -m pip install -r scripts/requirements.txt
      - name: Synchronize selected dataset
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_SCOPE: ${{ inputs.sync_scope || 'all' }}
        run: python scripts/sync_market_pipeline.py --report market-sync-report.json
      - name: Publish coverage and failure summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('market-sync-report.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              if not path.exists():
                  out.write('Market sync did not produce a report. See the failed step.\n')
              else:
                  r = json.loads(path.read_text())
                  out.write(f"## Market sync: {r['status']}\n\nScope: {r['scope']}\n\n")
                  out.write('| Dataset | Coverage |\n|---|---|\n')
                  for k in ['requested_symbols', 'archived_symbols', 'market', 'news', 'screeners', 'confirmed_writes']:
                      out.write(f'| {k} | {json.dumps(r.get(k, {}))} |\n')
                  out.write('\n### Provider issues\n\n')
                  issues = r['errors'] + r['warnings']
                  issues += [f"{s}: {w}" for s, v in r['symbols'].items() for w in v['warnings']]
                  for issue in issues:
                      out.write(f'- {issue}\n')
                  if not issues:
                      out.write('No issues reported.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-sync-report-${{ github.run_id }}
          path: market-sync-report.json
          retention-days: 30
          if-no-files-found: warn
