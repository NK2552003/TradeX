    <circle cx="1266" cy="656" r="5" fill="#83d2a3"/>
    <text x="1282" y="661" class="ui body">RELIANCE  /  Ascending triangle</text><text x="1675" y="661" text-anchor="end" class="ui green label">76%</text>
