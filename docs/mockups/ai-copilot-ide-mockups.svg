<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">alphajournal AI Copilot IDE redesign mockups</title>
  <desc id="desc">Static design preview showing desktop, tablet, and mobile AI Copilot IDE layouts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1d1d"/>
      <stop offset="1" stop-color="#151515"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <style>
      .ui { font-family: "DejaVu Sans", sans-serif; fill: #f2f2f0; }
      text { fill: #f2f2f0; }
      .muted { fill: #92918e; }
      .subtle { fill: #5f5e5b; }
      .line { stroke: #30302f; stroke-width: 1; }
      .tiny { font-size: 10px; letter-spacing: 1.4px; font-weight: 700; }
      .label { font-size: 12px; }
      .body { font-size: 13px; }
      .title { font-size: 18px; font-weight: 700; }
      .hero { font-size: 35px; font-weight: 800; letter-spacing: -1.8px; }
      .green { fill: #83d2a3; }
      .green-bg { fill: #193b2a; }
      .surface { fill: #181818; }
      .surface2 { fill: #20201f; }
      .blue { fill: #9bb8e8; }
      .yellow { fill: #e6c879; }
    </style>
  </defs>

  <g fill="#f2f2f0">

  <rect width="1800" height="1320" fill="url(#bg)"/>
  <text x="70" y="74" class="ui title">AI COPILOT / IDE WORKSPACE</text>
  <text x="70" y="104" class="ui muted body">A focused workbench for market questions, setups, and decisions.</text>
  <text x="1730" y="74" text-anchor="end" class="ui subtle tiny">STATIC DESIGN PREVIEW · 2026</text>

