    <rect x="708" y="1085" width="294" height="70" rx="8" fill="#1a1a1a" stroke="#30302f"/><text x="728" y="1113" class="ui muted label">◎  COMMAND</text><text x="728" y="1138" class="ui body">Review my journal</text>
